<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>嗅辨溯源 · 移动端</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="嗅辨溯源">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="map"></div>

<header id="topbar">
  <div class="brand">嗅辨溯源 <span class="tag">MVP</span></div>
  <button id="btnLocate" class="chip">重新定位</button>
</header>

<section id="sheet">
  <div class="sheet-handle"></div>

  <div class="status">
    <div class="status-row">
      <span id="locText" class="loc">正在定位…</span>
      <span class="btns">
        <button id="btnManual" class="ghost small">手动</button>
        <button id="btnCalib" class="ghost small">校准</button>
        <button id="btnRefresh" class="ghost small">刷新天气</button>
      </span>
    </div>
    <div id="weatherText" class="weather">—</div>
    <div id="manual" class="manual hidden">
      <label>风向<input id="mwDir" type="number" min="0" max="359" step="1" inputmode="numeric" placeholder="0-359°"></label>
      <label>风速<input id="mwSpd" type="number" min="0" step="0.1" inputmode="decimal" placeholder="m/s"></label>
      <button id="mwApply" class="ghost small">应用</button>
    </div>
    <div id="warnText" class="warn hidden"></div>
    <div id="envHint" class="warn hidden"></div>
  </div>

  <div class="block-title">气味强度（按你此刻的感受选择）</div>
  <div id="levels" class="levels"></div>

  <button id="btnSubmit" class="primary" disabled>提交嗅辨记录</button>

  <div id="summary" class="summary"></div>

  <div id="fusion" class="fusion hidden">
    <div class="fusion-head">
      <span>综合估计 <span id="fusionConf" class="conf"></span></span>
      <span class="btns">
        <button id="btnFusionToggle" class="ghost small">隐藏热区</button>
        <button id="btnFusionFocus" class="ghost small">聚焦</button>
      </span>
    </div>
    <div id="fusionText" class="fusion-text"></div>
    <div class="fusion-note">
      概率为模型相对评分，不是实测置信度；风向变化、多源或室内时仅供参考。
    </div>
  </div>

  <div class="block-title">已提交记录 <span id="recCount" class="muted"></span></div>
  <div id="records" class="records"><div class="empty">还没有记录。定位后选择气味强度并提交。</div></div>

  <div class="foot">
    <button id="btnClear" class="ghost small">清除全部</button>
    <span class="hint">扇形 = 可能的来源方向（粗略，上风向）</span>
  </div>
</section>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="js/geo.js"></script>
<script src="js/coords.js"></script>
<script src="js/fusion.js"></script>
<script src="js/app.js"></script>
</body>
</html>
